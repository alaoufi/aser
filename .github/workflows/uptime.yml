name: مراقبة الموقع
# كل 15 دقيقة يفحص jdatna.com/api/health من خوادم GitHub. عند التوقف يفتح Issue (يصلك تنبيه)، وعند العودة يغلقه.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: فحص الصحة
        id: health
        run: |
          ok=false; detail=""
          for i in 1 2 3; do
            body=$(curl -fsS --max-time 15 https://jdatna.com/api/health 2>&1) && \
              echo "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status")=="ready" and d.get("database") else 1)' && { ok=true; break; }
            detail="$body"; sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          { echo 'detail<<EOF'; echo "${detail:0:500}"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v9
        env:
          OK: ${{ steps.health.outputs.ok }}
          DETAIL: ${{ steps.health.outputs.detail }}
        with:
          script: |
            const title = "🔴 jdatna.com متوقف أو غير جاهز";
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "downtime", per_page: 10 })).data;
            const now = new Date().toISOString();
            if (process.env.OK !== "true") {
              if (open.length) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: `ما زال متوقفًا — ${now}\n\n\`\`\`\n${process.env.DETAIL}\n\`\`\`` });
              } else {
                await github.rest.issues.create({ owner, repo, title, labels: ["downtime"], body: `فشل فحص https://jdatna.com/api/health ثلاث مرات — ${now}\n\n\`\`\`\n${process.env.DETAIL}\n\`\`\`\n\nلا يتخذ هذا الفحص أي إجراء على الخادم.` });
              }
              core.setFailed("site down");
            } else {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `✅ عاد الموقع — ${now}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              }
            }
