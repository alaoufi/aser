name: jdatna-page
services:
  web:
    image: sha256:44fab56905377e476d463ac46d1b2a26897aea69c59c16c60cd0c621e679210b
    container_name: jdatna-page
    entrypoint: /usr/bin/caddy
    command: [run, --config, /etc/jdatna/Caddyfile, --adapter, caddyfile]
    user: "999:987"
    read_only: true
    cap_drop: [ALL]
    # The existing Caddy binary carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 64
    restart: "no"
    ports: ["172.18.0.1:8091:8080"]
    volumes:
      - /srv/jdatna/data/site:/site:ro
      - /opt/jdatna/infra/page.Caddyfile:/etc/jdatna/Caddyfile:ro
    tmpfs: ["/tmp:size=8m,mode=1777"]
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    networks: [page]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  page:
    name: jdatna_page
    internal: false
