name: jdatna
services:
  db:
    image: postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: jdatna-db
    # systemd owns restart ordering, so the storage mount must exist first.
    restart: "no"
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 150
    shm_size: 128m
    environment:
      POSTGRES_USER: jdatna_admin
      POSTGRES_DB: jdatna
      POSTGRES_PASSWORD_FILE: /run/secrets/db-admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB, -c, password_encryption=scram-sha-256]
    volumes:
      - /srv/jdatna/data/postgres:/var/lib/postgresql/data
      - /etc/jdatna/secrets/db-admin:/run/secrets/db-admin:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=0775
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U jdatna_admin -d jdatna]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  database:
    name: jdatna_database
    internal: true
