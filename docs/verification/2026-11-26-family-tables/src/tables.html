<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة الموائد</title><link rel="stylesheet" href="base.css">
<style>
/* «مكتبة الموائد» (نماذج للاعتماد، 2026-11-26): نفس الأطباق واسم الأسرة على أربعة أشكال. CSS/SVG فقط، بلا صور ثقيلة. */
body { background: var(--paper); }
.head { padding: 20px 16px 8px; }
.head small { color: var(--rust); font-weight: 700; font-size: 13px; }
.head h1 { font-family: "Amiri"; font-size: 30px; margin: 2px 0 0; line-height: 1.3; }
.head p { margin: 0; color: var(--muted); font-size: 14px; }
.table { position: relative; margin-top: 8px; padding: 8px 0 20px; overflow: hidden; }
.surface { position: absolute; inset-inline: 0; }
.dishes { position: relative; display: flex; gap: 10px; justify-content: center; padding: 0 12px; }
.dish { width: 116px; text-align: center; }
.plate { width: 108px; height: 108px; margin: 8px auto 10px; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: 0 0 0 5px #fff, 0 0 0 6px #d7c3a2, 0 16px 20px -6px #2b1f1759; }
.plate img { width: 100%; height: 100%; object-fit: cover; }
.dish strong { display: block; font-size: 15px; line-height: 1.4; }
.dish span { color: var(--rust); font-weight: 800; font-size: 14px; }
.owner { position: relative; display: flex; justify-content: center; margin-top: 14px; }
.owner b { font-family: "Amiri"; font-size: 22px; line-height: 1.5; padding: 8px 26px; }
.label { padding: 14px 16px 4px; font-weight: 700; font-size: 15px; color: var(--olive-deep); display: flex; justify-content: space-between; }
.label i { font-style: normal; color: var(--muted); font-weight: 400; font-size: 13px; }
section.variant { display: none; }
body[data-v="sadu"] #sadu, body[data-v="abyad"] #abyad, body[data-v="nahas"] #nahas, body[data-v="khoos"] #khoos { display: block; }

/* 1) السدو */
#sadu .surface { top: 62px; height: 46px; background: var(--sadu) repeat-x center / auto 46px; box-shadow: 0 -3px 0 #efe3cc, 0 3px 0 #efe3cc, 0 12px 20px #2b1f172e; }
#sadu .table { background: linear-gradient(180deg, transparent 0 45%, var(--cream) 45%); }
#sadu .owner b { background: var(--sadu) repeat-x top / auto 7px, var(--sadu) repeat-x bottom / auto 7px, #fffaf2; padding: 13px 26px; box-shadow: 0 8px 16px #2b1f171f; }

/* 2) مفرش أبيض مطرّز */
#abyad .table { background: #f3ede2; }
#abyad .surface { top: 18px; bottom: 6px; inset-inline: 10px; border-radius: 6px;
  background:
    repeating-linear-gradient(0deg, #ffffff00 0 3px, #e9e1d3 3px 4px),
    repeating-linear-gradient(90deg, #ffffff00 0 3px, #ece5d8 3px 4px),
    #fbf8f2;
  box-shadow: 0 10px 24px #2b1f1722, inset 0 0 0 10px #fbf8f2, inset 0 0 0 11px #9c2f1e55;
  outline: 2px dashed #9c2f1e88; outline-offset: -18px; }
#abyad .surface::after { content: ""; position: absolute; inset-inline: 0; bottom: -8px; height: 10px; background: radial-gradient(circle at 6px 0, #fbf8f2 5px, transparent 5.5px) repeat-x 0 0 / 12px 10px; }
#abyad .owner b { color: #8f2a1b; font-size: 24px; background: none; border-bottom: 2px dashed #9c2f1e99; padding: 0 6px 2px; }

/* 3) صينية نحاس */
#nahas .table { background: #efe3cf; padding-top: 18px; }
#nahas .surface { inset-inline: auto; left: 50%; transform: translateX(-50%); top: 6px; width: 420px; height: 236px; border-radius: 50%;
  background:
    radial-gradient(ellipse at 50% 40%, #f6d79a 0 18%, transparent 19%),
    repeating-radial-gradient(ellipse at 50% 50%, #c58b3a 0 9px, #b0752b 9px 11px, #d9a65a 11px 20px),
    #c58b3a;
  box-shadow: inset 0 0 0 10px #a56a24, inset 0 0 0 13px #e8c07a, inset 0 0 40px #6b3f12aa, 0 18px 28px #2b1f173a; }
#nahas .dishes { padding-top: 10px; }
#nahas .dish strong, #nahas .dish span { display: inline-block; background: #fffaf2ee; border-radius: 8px; padding: 0 8px; margin-top: 2px; }
#nahas .owner { margin-top: 18px; }
#nahas .owner b { background: linear-gradient(180deg, #f3d38c, #c9953f); color: #3b2410; border-radius: 6px; padding: 4px 22px; box-shadow: inset 0 0 0 2px #a56a24, 0 6px 12px #2b1f172e; font-size: 21px; }

/* 4) سفرة خوص */
#khoos .table { background: #ece0c8; }
#khoos .surface { top: 34px; height: 92px; bottom: auto; inset-inline: 0;
  background:
    repeating-linear-gradient(0deg, #0000 0 16px, #9c2f1e 16px 20px, #0000 20px 36px, #4f5d36 36px 40px, #0000 40px 72px),
    repeating-linear-gradient(45deg, #d8b77a 0 6px, #c9a463 6px 12px),
    repeating-linear-gradient(-45deg, #d8b77a 0 6px, #bf9a59 6px 12px);
  background-blend-mode: normal, multiply, normal;
  box-shadow: inset 0 6px 0 #a8834a, inset 0 -6px 0 #a8834a, 0 12px 22px #2b1f172e; }
#khoos .owner b { background: #fffaf2; border: 3px solid #b88f4f; border-radius: 999px; padding: 4px 24px; font-size: 21px; box-shadow: 0 6px 12px #2b1f1726; }
</style></head><body data-v="sadu">
